services:
  opentv:
    build: .
    container_name: "${OPENTV_CONTAINER_NAME:-opentv}"
    restart: unless-stopped
    ports:
      - "${OPENTV_BIND:-127.0.0.1}:${OPENTV_PORT:-3080}:3080"
    environment:
      NODE_ENV: production
      PORT: "3080"
      OPENTV_CATALOG_TTL_MS: "21600000"
      OPENTV_VBOX_PLAYLIST_URL: "${OPENTV_VBOX_PLAYLIST_URL:-}"
      OPENTV_VBOX_TRANSCODE_AUDIO: "${OPENTV_VBOX_TRANSCODE_AUDIO:-true}"
      OPENTV_VBOX_VIDEO_ENCODER: "${OPENTV_VBOX_VIDEO_ENCODER:-cpu}"
      OPENTV_VBOX_VAAPI_DEVICE: "${OPENTV_VBOX_VAAPI_DEVICE:-/dev/dri/renderD128}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
